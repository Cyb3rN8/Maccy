name: Build

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  build:
    # AppIcon.icon (Icon Composer) needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -destination 'platform=macOS' \
            -only-testing:MaccyTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E '(error:|failed|passed|Test run|\*\* TEST)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' test.log

      # Unsigned arm64 build; the app is signed locally. `-quiet` keeps only
      # warnings and errors, so failures are readable in the job log.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -quiet \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      # Diagnostic only: the universal Release build failed on x86_64.
      - name: Build x86_64 (diagnostic)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-x86 \
            -quiet \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-x86.log

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/Maccy.app Maccy.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Maccy-unsigned
          path: Maccy.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: '*.log'
          retention-days: 7
