name: Build

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  build:
    # AppIcon.icon (Icon Composer) needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild test \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -destination 'platform=macOS' \
            -only-testing:MaccyTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E '(error:|failed|passed|Test run|\*\* TEST)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' test.log

      # Unsigned arm64 build; the app is signed locally. Xcode 26.6's optimizer
      # crashes on FloatingPanel's deinit in Release, so installed Xcode 26
      # versions are tried newest first and the first that builds is used.
      # `-quiet` keeps only warnings and errors in the job log.
      - name: Build
        run: |
          ls -d /Applications/Xcode_26*.app
          for xcode in $(ls -d /Applications/Xcode_26*.app | sort -rV); do
            [ -L "$xcode" ] && continue
            echo "::group::Release build with $xcode"
            log="build-$(basename "$xcode" .app).log"
            if DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild build \
                -project Maccy.xcodeproj \
                -scheme Maccy \
                -configuration Release \
                -destination 'generic/platform=macOS' \
                -derivedDataPath "build/$(basename "$xcode" .app)" \
                -quiet \
                ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
                CODE_SIGNING_ALLOWED=NO \
                >"$log" 2>&1; then
              echo "::endgroup::"
              echo "Built with $xcode"
              echo "APP_PATH=build/$(basename "$xcode" .app)/Build/Products/Release/Maccy.app" >>"$GITHUB_ENV"
              exit 0
            fi
            grep -E "error:|Stack dump|^ for |Command .* failed" "$log" | head -20
            echo "::endgroup::"
            echo "::warning::Release build failed with $xcode"
          done
          exit 1

      - name: Package
        run: ditto -c -k --keepParent "$APP_PATH" Maccy.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Maccy-unsigned
          path: Maccy.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: '*.log'
          retention-days: 7
